syntax = "proto3";

package symposia.blobstorage.v1;

option csharp_namespace = "Symposia.BlobStorage.Protocol";

// Private gateway-to-node protocol, run over TLS. Not the public S3/Azure HTTP interface.
// See Requirements/BlobStorage/gateway-architecture.md#gateway-node-protocol.
service StorageNode {
  // Client-streaming so the node never buffers the full blob in memory before it hits disk.
  rpc WriteBlob(stream WriteBlobChunk) returns (WriteBlobResponse);

  // Server-streaming with optional byte-range support for partial reads.
  rpc ReadBlob(ReadBlobRequest) returns (stream ReadBlobChunk);

  rpc DeleteBlob(DeleteBlobRequest) returns (DeleteBlobResponse);

  // Lightweight liveness/load probe used for the gateway's node health cache.
  rpc Probe(ProbeRequest) returns (ProbeResponse);

  // Proof-of-possession: hash a requested byte range without transferring the full blob.
  rpc IntegrityChallenge(IntegrityChallengeRequest) returns (IntegrityChallengeResponse);

  // Enumerate all CIDs this node holds, paginated. Used by the gateway for reconciliation.
  rpc ListBlobs(ListBlobsRequest) returns (stream ListBlobsChunk);

  // #12 Layer 2: the node's manifest change feed. Events after `after_seq`, or a full snapshot
  // (first message has reset = true) when the cursor is 0 or older than the node still keeps,
  // then live events, with periodic heartbeats. Never ends on its own; the caller cancels.
  rpc WatchManifest(WatchManifestRequest) returns (stream ManifestEvent);

  // #12 Layer 3: a Merkle inclusion proof for `cid` in the manifest root this node submitted
  // on-chain for `epoch` (0 = its latest submitted epoch), for disputes and the on-chain fallback.
  rpc GetManifestProof(ManifestProofRequest) returns (ManifestProofResponse);
}

message WriteBlobChunk {
  oneof payload {
    WriteBlobHeader header = 1;
    bytes data = 2;
  }
}

message WriteBlobHeader {
  string tenant_id = 1;
  string bucket = 2;
  string key = 3;
  repeated string region_tags = 4;
  // Body size when the gateway knows it (#199); 0 = unknown. Lets a node refuse up front.
  int64 expected_size_bytes = 5;
}

message WriteBlobResponse {
  string cid = 1;
  int64 size_bytes = 2;
  // #8 FR6.4: root of the blob's Merkle tree over 64 KiB leaves, for range challenge-response.
  // Empty from nodes that predate it; the gateway then falls back to whole-blob challenges.
  bytes merkle_root = 3;
}

message ReadBlobRequest {
  string cid = 1;
  int64 offset = 2; // 0 = start of blob
  int64 length = 3; // 0 = read to end
}

message ReadBlobChunk {
  bytes data = 1;
}

message DeleteBlobRequest {
  string cid = 1;
}

message DeleteBlobResponse {
  bool deleted = 1;
}

message ProbeRequest {
}

message ProbeResponse {
  string node_id = 1;
  int64 used_storage_bytes = 2;
  int64 available_storage_bytes = 3;
  int64 blob_count = 4;
  bool healthy = 5;
  // #199: the node refuses new writes because its disk can't cover its allocation; reads still work.
  bool read_only = 6;
  int64 volume_free_bytes = 7;
  int64 reserve_bytes = 8;
  // The region this node serves (#7 region-aware quorum); empty = not configured.
  string region = 9;
  // #8 FR2.1 fault-domain inputs, self-reported. The gateway prefers the address it actually connects
  // to over public_ip; asn and facility_id stay best-effort until region verification exists.
  string public_ip = 10;
  int64 asn = 11;
  string facility_id = 12;
  // #8 FR3.3: measured (or operator-declared) upload capacity, for the replication bandwidth budget; 0 = unknown.
  int64 upload_bytes_per_second = 13;
  // #8 FR6.3: blobs the node's own randomized self-check found corrupt or missing since it started.
  int64 integrity_failures = 14;
}

message IntegrityChallengeRequest {
  string cid = 1;
  int64 offset = 2;
  int64 length = 3; // 0 = hash to end of blob
  // #8 FR6.4: prove possession of one leaf with a Merkle inclusion proof instead of hashing a range.
  bool merkle_proof = 4;
  int64 leaf_index = 5;
}

message IntegrityChallengeResponse {
  string sha256_hex = 1;
  // Set when merkle_proof was asked and the node supports it (older nodes leave these empty).
  bool proof_supported = 2;
  bytes leaf_data = 3;
  repeated bytes siblings = 4; // bottom-up sibling hashes; an empty entry means "no sibling, carried up"
  int64 leaf_count = 5;
}

message ListBlobsRequest {
  string after_cid = 1; // empty = start from beginning; use last received CID to paginate
}

message ListBlobsChunk {
  repeated string cids = 1;
}

message WatchManifestRequest {
  int64 after_seq = 1; // 0 = start with a snapshot
}

message ManifestEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    PUT = 1;        // the node holds `cid` with `status`; snapshot rows are PUTs too
    REMOVED = 2;    // the node no longer holds `cid`
    CAUGHT_UP = 3;  // snapshot and backlog delivered; what follows is live
    HEARTBEAT = 4;  // no change; carries the digest fields only
  }

  Kind kind = 1;
  int64 seq = 2;             // 0 on snapshot rows, CAUGHT_UP and HEARTBEAT
  string cid = 3;
  int64 size_bytes = 4;
  string status = 5;         // Active | PendingGc | Orphaned; only Active counts as holding
  int64 occurred_at_unix_ms = 6;
  bool reset = 7;            // drop everything previously learned from this node first
  int64 head_seq = 8;        // the node's latest seq (CAUGHT_UP, HEARTBEAT)
  int64 active_count = 9;    // Active blobs the node holds (CAUGHT_UP, HEARTBEAT): a cheap anti-entropy digest
  int32 schema_version = 10; // 1 for this shape; consumers ignore fields they don't know
}

message ManifestProofRequest {
  string cid = 1;
  uint64 epoch = 2; // 0 = latest submitted
}

message ManifestProofResponse {
  bool found = 1;             // false: no submitted root, or `cid` isn't in it
  uint64 epoch = 2;
  bytes root = 3;
  int64 leaf_index = 4;
  int64 leaf_count = 5;
  repeated bytes siblings = 6; // bottom-up, as IntegrityChallengeResponse.siblings
  int64 size_bytes = 7;        // with cid and tenant_id, the leaf the verifier rebuilds
  string tenant_id = 8;
}
