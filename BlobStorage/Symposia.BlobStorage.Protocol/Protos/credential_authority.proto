syntax = "proto3";

package symposia.blobstorage.credentials.v1;

option csharp_namespace = "Symposia.BlobStorage.Protocol.Credentials";

// Gateway <- Credential Authority push channel (BlobStorage #3). The Authority's state carries a version that
// every mutation bumps; Watch streams each new version, and the gateway pulls the snapshot it names. Gateways
// also poll the snapshot on a timer, so a dropped stream delays propagation by at most one poll interval.
service CredentialAuthority {
  rpc Watch(WatchRequest) returns (stream StateVersion);
}

message WatchRequest {
  int64 since_version = 1; // the version the gateway already holds; 0 = none
}

message StateVersion {
  int64 version = 1;
}
